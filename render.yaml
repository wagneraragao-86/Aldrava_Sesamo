services:
  - type: web
    name: aldrava-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w @aldrava/shared && npm run prisma:generate -w @aldrava/backend && npm run build -w @aldrava/backend
    startCommand: npm run prisma:migrate -w @aldrava/backend && npm run seed -w @aldrava/backend && npm run start -w @aldrava/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ESP32_TOKEN
        sync: false
      - key: ESP32_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
